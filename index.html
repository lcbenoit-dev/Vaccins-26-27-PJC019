<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quel vaccin prescrire - PJC019 - saison 2026-2027</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    max-width:320px;
    display:block;
    margin:0 auto 15px auto;
}

h1{
    color:#003366;
    margin:0;
}

h2{
    color:#003366;
}

label{
    display:block;
    margin:12px 0;
}

input[type=date]{
    padding:10px;
    font-size:16px;
}

button{
    background:#005eb8;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#00488d;
}

.admissible{
    background:#e8f5e9;
    border-left:6px solid #2e7d32;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
}

.nonadmissible{
    background:#ffebee;
    border-left:6px solid #c62828;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
}

.section{
    margin-top:25px;
}

.age{
    font-size:24px;
    font-weight:bold;
    color:#005eb8;
    background:#eef5ff;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<img src="logo-jean-coutu.png" alt="Jean Coutu" class="logo">

<h1>
Quel vaccin prescrire?<br>
PJC Drummondville - Saison 2026-2027
</h1>

</div>

<label>
<strong>Date de naissance</strong><br>
<input type="date" id="dob" onchange="afficherAge()">
</label>

<p class="age">
Âge calculé : <span id="ageAffiche">-</span> ans
</p>

<hr>

<h2>Facteurs de risque</h2>

<label>
<input type="checkbox" id="c6">
Diabète, asthme grave, maladie pulmonaire chronique,
insuffisance cardiaque ou rénale, IMC > 40
</label>

<label>
<input type="checkbox" id="c7">
Immunosuppression importante
</label>

<label>
<input type="checkbox" id="c8">
Résidence pour aînés
</label>

<label>
<input type="checkbox" id="c9">
Grossesse (2e ou 3e trimestre)
</label>

<label>
<input type="checkbox" id="c10">
Proche aidant ou habite avec une personne à risque
</label>

<label>
<input type="checkbox" id="c12">
Travailleur de la santé
</label>

<label>
<input type="checkbox" id="c13">
Déjà reçu un vaccin contre le pneumocoque
</label>

<br>

<button onclick="calculer()">
Vérifier l'admissibilité
</button>

</div>

<div class="card section" id="resultat"></div>

</div>

<script>

function afficherAge(){

    const dateNaissance =
        document.getElementById("dob").value;

    if(!dateNaissance){
        document.getElementById("ageAffiche").innerHTML = "-";
        return;
    }

    const age = calculAge(dateNaissance);

    document.getElementById("ageAffiche").innerHTML = age;
}

function calculAge(dateNaissance){

    const aujourd = new Date();
    const [annee, moisN, jour] = dateNaissance.split("-").map(Number);
    const naissance = new Date(annee, moisN - 1, jour);

    let age =
        aujourd.getFullYear() -
        naissance.getFullYear();

    const mois =
        aujourd.getMonth() -
        naissance.getMonth();

    if(
        mois < 0 ||
        (
            mois === 0 &&
            aujourd.getDate() < naissance.getDate()
        )
    ){
        age--;
    }

    return age;
}

function carte(titre,admissible){

    return `
        <div class="${admissible ? 'admissible':'nonadmissible'}">
            ${admissible ? '✅' : '❌'}
            <strong>${titre}</strong>
        </div>
    `;
}

function calculer(){

    const dateNaissance =
        document.getElementById("dob").value;

    if(!dateNaissance){
        alert("Veuillez entrer une date de naissance.");
        return;
    }

    const age = calculAge(dateNaissance);

    const c6 =
        document.getElementById("c6").checked;

    const c7 =
        document.getElementById("c7").checked;

    const c8 =
        document.getElementById("c8").checked;

    const c9 =
        document.getElementById("c9").checked;

    const c10 =
        document.getElementById("c10").checked;

    const c12 =
        document.getElementById("c12").checked;

    const dejaPneumo =
        document.getElementById("c13").checked;

    const age75 = age >= 75;
    const age6574 = age >= 65 && age <= 74;

    const nbFacteurs =
        [c6,c7,c8,c9,c10,age6574,c12]
        .filter(Boolean)
        .length;

    const fluad =
        age75;

    const fluzonePQI =
        nbFacteurs > 0;

    const fluzonePrive =
        !(fluad || fluzonePQI);

    const spikevaxPQI =
        age75 ||
        c6 ||
        c7 ||
        c8 ||
        c9 ||
        age6574 ||
        c12;

    const comirnatyPrive =
        !spikevaxPQI && age >= 12;

    const mresviaPQI =
        age75;

    const abrysvoPrive =
        !mresviaPQI && age >= 60;

    const capvaxivePQI =
        !dejaPneumo &&
        (
            age >= 65 ||
            (
                age >= 50 &&
                (c6 || c7)
            )
        );

    const capvaxivePrive =
        !capvaxivePQI &&
        !dejaPneumo &&
        age >= 18;

    const shingrixPQI =
        age >= 71 ||
        (
            age >= 18 &&
            c7
        );

    const shingrixPrive =
        !shingrixPQI &&
        age >= 50;

    document.getElementById("resultat").innerHTML = `

        <h2>Résultats</h2>

        <p class="age">
        Âge : ${age} ans
        </p>

        <h3>Influenza</h3>

        ${carte("PQI-Fluad gratuit", fluad)}
        ${carte("PQI-Fluzone gratuit", fluzonePQI)}
        ${carte("Fluzone avec frais (40 $). Minimum 6 mois.", fluzonePrive)}

        <h3>COVID-19</h3>

        ${carte("PQI-Spikevax gratuit", spikevaxPQI)}
        ${carte("Comirnaty avec frais (163 $). Minimum 12 ans.", comirnatyPrive)}

        <h3>Virus respiratoire syncytial (VRS)</h3>

        ${carte("PQI-mResvia gratuit", mresviaPQI)}
        ${carte("Abrysvo avec frais (299 $). Minimum 60 ans", abrysvoPrive)}

        <h3>Pneumocoque</h3>

        ${carte("PQI-Capvaxive gratuit", capvaxivePQI)}
        ${carte("Capvaxive avec frais (186 $). Minimum 18 ans.", capvaxivePrive)}

        <h3>Zona</h3>

        ${carte("PQI-Shingrix gratuit", shingrixPQI)}
        ${carte("Shingrix avec frais (239 $ x 2 doses). Minimum 50 ans", shingrixPrive)}
    `;
}

</script>

</body>
</html>
